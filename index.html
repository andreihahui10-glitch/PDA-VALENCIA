<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDA Emergencias Valencia - ERLC</title>
    <style>
        :root {
            --bg-dark: #121824;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --accent-red: #dc2626;
            --accent-yellow: #d97706;
            --accent-green: #16a34a;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            border-left: 6px solid var(--accent-blue);
            margin-bottom: 20px;
        }

        .dept-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-dept {
            background: var(--card-bg);
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-dept.active, .btn-dept:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .btn-status {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        .status-10-8 { background-color: var(--accent-green); }
        .status-10-97 { background-color: var(--accent-yellow); }
        .status-10-23 { background-color: var(--accent-blue); }
        .status-10-10 { background-color: var(--accent-red); }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .feed-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>PDA CENTRO DE COORDINACIÓN DE EMERGENCIAS 112 - VALENCIA</h2>
        <div>Estado Actual: <span id="current-status" style="color: #16a34a; font-weight: bold;">10-8 Disponible</span></div>
    </div>

    <!-- Selección de Servicio -->
    <div class="dept-selector">
        <button class="btn-dept active" onclick="setDept('PLV / CNP / GC')">🚔 Cuerpos Policiales</button>
        <button class="btn-dept" onclick="setDept('Bombers València')">🚒 Bomberos</button>
        <button class="btn-dept" onclick="setDept('SAMU / SVB')">🚑 Emergencias Sanitarias</button>
        <button class="btn-dept" onclick="setDept('Conservación Carreteras')">🚜 Conservación / Grúa</button>
        <button class="btn-dept" onclick="setDept('CCE 112 Dispatch')">🎧 Operador 112</button>
    </div>

    <div class="grid-container">
        
        <!-- Panel de Control Unidades -->
        <div class="card">
            <h3>Gestión de Unidad</h3>
            <div class="form-group">
                <label>Indicativo de Unidad (Ej: METRO-10, H-20, SAMU-1)</label>
                <input type="text" id="unit-id" placeholder="Ingresa tu clave de unidad">
            </div>

            <h4>Estado Operativo</h4>
            <div class="status-grid">
                <button class="btn-status status-10-8" onclick="sendStatus('10-8 | Disponible')">10-8 Disponible</button>
                <button class="btn-status status-10-23" onclick="sendStatus('10-23 | En Camino')">10-23 En Camino</button>
                <button class="btn-status status-10-97" onclick="sendStatus('10-97 | En Escena')">10-97 En Escena</button>
                <button class="btn-status status-10-10" onclick="sendStatus('10-10 | Fuera de Servicio')">10-10 Fuera de Servicio</button>
            </div>
        </div>

        <!-- Panel de Reportes / Avisos 112 -->
        <div class="card">
            <h3>Crear Registro / Alerta 112</h3>
            <form id="incident-form" onsubmit="submitIncident(event)">
                <div class="form-group">
                    <label>Tipo de Emergencia / Incidencia</label>
                    <select id="incident-type">
                        <option value="Accidente de Tráfico (A-7/V-30)">Accidente de Tráfico</option>
                        <option value="Incendio Estructural / Forestal">Incendio Estructural / Forestal</option>
                        <option value="Atención Sanitaria de Urgencia">Atención Sanitaria</option>
                        <option value="Persecución / Delito en Proceso">Intervención Policial</option>
                        <option value="Obstáculo en Calzada / Vehículo Averiado">Conservación / Retirada Grúa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ubicación / Zona en ERLC (Ej: Comisaría Central, Gasolinera, V-30)</label>
                    <input type="text" id="incident-location" required placeholder="Ej: Carretera Principal cerca del Taller">
                </div>
                <div class="form-group">
                    <label>Detalles del Incidente</label>
                    <textarea id="incident-details" rows="3" placeholder="Descripción de los hechos y unidades requeridas..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar Registro al Sistema</button>
            </form>

            <h4 style="margin-top:20px;">Historial de Incidentes Activos</h4>
            <div id="incident-feed">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

    </div>

    <script>
        let currentDept = "PLV / CNP / GC";

        function setDept(dept) {
            currentDept = dept;
            document.querySelectorAll('.btn-dept').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function sendStatus(status) {
            const unit = document.getElementById('unit-id').value || "Unidad Sin Asignar";
            document.getElementById('current-status').innerText = status;

            // Envío de Webhook a Discord (Opcional)
            sendDiscordWebhook(`📢 **Cambio de Estado**\n**Servicio:** ${currentDept}\n**Unidad:** ${unit}\n**Estado:** ${status}`);
        }

        function submitIncident(e) {
            e.preventDefault();
            const type = document.getElementById('incident-type').value;
            const location = document.getElementById('incident-location').value;
            const details = document.getElementById('incident-details').value;
            const unit = document.getElementById('unit-id').value || "CCE 112";

            const feed = document.getElementById('incident-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<strong>[${type}]</strong> - ${location}<br><small>${details} | Registrado por: ${unit} (${currentDept})</small>`;
            feed.prepend(item);

            // Enviar alerta al Webhook de Discord
            sendDiscordWebhook(`🚨 **NUEVO AVISO DE EMERGENCIA - 112 VALENCIA** 🚨\n**Tipo:** ${type}\n**Ubicación:** ${location}\n**Detalles:** ${details}\n**Generado por:** ${unit} (${currentDept})`);

            document.getElementById('incident-form').reset();
        }

        function sendDiscordWebhook(message) {
            // Reemplaza esta URL con la Webhook de tu canal de Discord
            const webhookUrl = "TU_DISCORD_WEBHOOK_URL_AQUI"; 
            
            if(webhookUrl === "TU_DISCORD_WEBHOOK_URL_AQUI") return;

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            });
        }
    </script>
</body>
</html>
